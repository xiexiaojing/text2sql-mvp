version: 1                            # 配置文件版本号
concepts:                             # 语义概念定义（轻量级关键词概念检测，供 Router 和 SchemaContextBuilder 使用）
  project:                            # 项目概念
    display_name: 项目                # 概念显示名称
    keywords: ["项目", "project"]     # 触发该概念的关键词列表（命中任一即匹配）
    object: Project                   # 关联的实体对象名
    rule:                             # 概念匹配规则
      type: table_count               # 规则类型：table_count=基于表行数统计
      table: project                  # 关联的物理表名
  purchase:                           # 采购概念
    display_name: 采购                # 概念显示名称
    keywords: ["采购", "purchase", "采购单", "采购物品"]  # 触发关键词列表
    object: PurchaseOrder             # 关联的实体对象名
    rule:                             # 概念匹配规则
      type: table_count               # 规则类型
      table: purchase_order           # 关联的物理表名
  supplier:                           # 供应商概念
    display_name: 供应商              # 概念显示名称
    keywords: ["供应商", "商家", "supplier", "gongyingshang", "供应商主体"]  # 触发关键词列表
    object: Supplier                  # 关联的实体对象名
    rule:                             # 概念匹配规则
      type: table_count               # 规则类型
      table: caigou_gongyingshang     # 关联的物理表名
  inquiry:                            # 询价概念
    display_name: 询价                # 概念显示名称
    keywords: ["询价", "inquiry", "询价单", "报价"]  # 触发关键词列表
    object: Inquiry                   # 关联的实体对象名
    rule:                             # 概念匹配规则
      type: table_count               # 规则类型
      table: inquiry                  # 关联的物理表名
  user:                               # 用户概念
    display_name: 用户                # 概念显示名称
    keywords: ["用户", "员工", "user", "人员", "账号"]  # 触发关键词列表
    object: User                      # 关联的实体对象名
    rule:                             # 概念匹配规则
      type: table_count               # 规则类型
      table: sys_user                 # 关联的物理表名
  dept:                               # 部门概念
    display_name: 部门                # 概念显示名称
    keywords: ["部门", "dept", "组织"]  # 触发关键词列表
    object: Dept                      # 关联的实体对象名
    rule:                             # 概念匹配规则
      type: table_count               # 规则类型
      table: sys_dept                 # 关联的物理表名
  conference:                         # 会议概念
    display_name: 会议                # 概念显示名称
    keywords: ["会议", "conference", "会议室", "开会"]  # 触发关键词列表
    object: Conference                # 关联的实体对象名
    rule:                             # 概念匹配规则
      type: table_count               # 规则类型
      table: conference               # 关联的物理表名
  news:                               # 知讯/通知公告概念
    display_name: 知讯                # 概念显示名称
    keywords: ["知讯", "通知", "公告", "news", "文档制度", "制度"]  # 触发关键词列表
    object: News                      # 关联的实体对象名
    rule:                             # 概念匹配规则
      type: table_count               # 规则类型
      table: kno_news                 # 关联的物理表名
sensitive_search_keywords:            # 敏感字段检索关键词（命中时需走敏感字段审批路径）
  - 手机号                            # 中文敏感关键词
  - 电话                              # 中文敏感关键词
  - mobile                            # 英文敏感关键词
  - phonenumber                       # 用户手机号字段名
  - 邮箱                              # 邮箱也视为敏感信息
  - email                             # 邮箱字段名
