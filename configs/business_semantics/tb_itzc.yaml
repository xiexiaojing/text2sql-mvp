version: 1
notes:
  - IT IT资产表（tb_itzcbd）

entities:
  Asset:
    tables: [tb_itzcbd]


intents:

  # ==================== IT资产总数（全局 / 多维过滤） ====================
  # "IT资产总数 / 多少IT资产" → 统计全量；"在用IT资产有多少 / 苹果品牌IT资产数量" → 带过滤
  - id: asset_total_count
    display_name: IT资产总数
    status: executable
    priority: 88
    match:
      any:
        - "IT资产数"
        - "IT资产总数"
        - "IT资产数量"
        - "多少IT资产"
        - "IT资产有多少"
        - "有多少IT资产"
        - "设备数"
        - "设备总数"
        - "多少设备"
        - "设备有多少"
        - "几台IT资产"
        - "几件IT资产"
        - "数量"
    examples:
      - "IT资产总数"
      - "有多少IT资产"
      - "设备总数"
      - "在用IT资产有多少"
      - "苹果品牌IT资产数量"
    semantic:
      queries:
        - "统计 IT IT资产总数"
        - "集团一共多少台设备"
        - "某状态下IT资产数量"
        - "某品牌IT资产有多少"
    ontology_refs: [Asset]
    physical_tables: [tb_itzcbd]
    optional_slots: [zczt, pp, cfdd, cwsszt, zcly, gys, dept_id, user_id]
    slot_defaults: {}
    output_type: scalar_count
    template: asset_total_count
    remark:
      - "zczt是资产状态"
      - "pp是品牌"
      - "cfdd是存放地点"
      - "cwsszt是财务所属主体"
      - "zcly是资产来源"
      - "gys是供应商"
      - "dept_id是部门"
      - "user_id是使用人"

  # ==================== IT资产按分组条件分布 ====================
  - id: asset_groupby_count
    display_name: IT资产按分组条件分布
    status: executable
    priority: 90
    match:
      any: ["IT资产", "分布", "统计", "各", "占比", "排行", "分别"]
      none: ["总数", "原值", "成本", "单价"]
    examples:
      - "IT资产状态分布"
      - "各状态IT资产数量"
      - "IT资产状态占比"
    semantic:
      queries:
        - "按IT资产状态分组统计"
        - "各类状态各有多少IT资产"
    ontology_refs: [Asset]
    physical_tables: [tb_itzcbd]
    optional_slots: [zczt, pp, cfdd, cwsszt, zcly, gys, dept_id, user_id]
    output_type: grouped_count
    template: asset_groupby_count
    remark:
      - "zczt是资产状态"
      - "pp是品牌"
      - "cfdd是存放地点"
      - "cwsszt是财务所属主体"
      - "zcly是资产来源"
      - "gys是供应商"
      - "dept_id是部门"
      - "user_id是使用人"
    reason: "请选出问题${question}中涉及到的插槽"


  # ==================== IT资产按部门分布 ====================
  # 需同时含 "IT资产" 以区别于用户域的部门人数意图
  - id: asset_by_dept
    display_name: IT资产按部门分布
    status: executable
    priority: 90
    match:
      all: ["IT资产", "部门"]
      any: ["分布", "统计", "各", "占比", "分别", "排行"]
      none: ["原值", "成本", "单价"]
    examples:
      - "IT资产按部门分布"
      - "各部门IT资产数量"
      - "IT资产各部门排行"
    semantic:
      queries:
        - "按部门分组统计IT资产"
        - "各部门的IT资产分布"
    ontology_refs: [Asset]
    physical_tables: [tb_itzcbd]
    output_type: grouped_count
    template: asset_by_dept


  # ==================== IT资产明细列表（支持过滤） ====================
  - id: asset_list
    display_name: IT资产明细列表
    status: executable
    priority: 85
    match:
      any:
        - "IT资产列表"
        - "IT资产清单"
        - "IT资产明细"
        - "IT资产台账"
        - "设备清单"
        - "IT资产名单"
        - "有哪些IT资产"
        - "IT资产有哪些"
      none:
        - "总数"
        - "多少"
        - "数量"
        - "分布"
        - "统计"
        - "原值"
        - "成本"
    examples:
      - "IT资产列表"
      - "IT资产明细"
      - "苹果品牌IT资产清单"
      - "北京存放的IT资产有哪些"
    semantic:
      queries:
        - "列出 IT IT资产台账"
        - "查询某品牌IT资产明细"
    ontology_refs: [Asset]
    physical_tables: [tb_itzcbd]
    optional_slots: [zczt, pp, cfdd, cwsszt, user_id]
    slot_defaults: {}
    output_type: list
    template: asset_list
    remark:
      - "zczt是资产状态"
      - "pp是品牌"
      - "cfdd是存放地点"
      - "cwsszt是财务所属主体"
      - "user_id是使用人"

  # ==================== IT资产原值合计（全局 / 过滤） ====================
  - id: asset_value_total
    display_name: IT资产原值合计
    status: executable
    priority: 88
    match:
      all: ["原值"]
      any: ["合计", "总和", "总额", "总计", "一共"]
      none: ["状态", "品牌", "地点", "按", "各", "分布", "部门"]
    examples:
      - "IT资产原值合计"
      - "IT资产原值总额"
      - "在用IT资产原值多少"
    semantic:
      queries:
        - "统计IT资产原值总和"
        - "全部IT资产原值一共多少"
    ontology_refs: [Asset]
    physical_tables: [tb_itzcbd]
    optional_slots: [zczt, pp]
    slot_defaults: {}
    output_type: scalar_sum
    template: asset_value_total


  # ==================== IT资产原值按状态分布 ====================
  - id: asset_value_by_status
    display_name: IT资产原值按状态分布
    status: executable
    priority: 90
    match:
      all: ["原值", "状态"]
      any: ["分布", "统计", "各", "占比", "合计", "分别"]
      none: ["数量", "有多少"]
    examples:
      - "IT资产原值按状态分布"
      - "各状态IT资产原值合计"
    semantic:
      queries:
        - "按状态汇总IT资产原值"
        - "各状态原值占比"
    ontology_refs: [Asset]
    physical_tables: [tb_itzcbd]
    output_type: grouped_sum
    template: asset_value_by_status


  # ==================== IT资产原值按部门分布 ====================
  - id: asset_value_by_dept
    display_name: IT资产原值按部门分布
    status: executable
    priority: 90
    match:
      all: ["原值", "部门"]
      any: ["分布", "统计", "各", "占比", "合计", "分别"]
      none: ["数量", "有多少"]
    examples:
      - "IT资产原值按部门分布"
      - "各部门IT资产原值合计"
    semantic:
      queries:
        - "按部门汇总IT资产原值"
        - "各部门原值占比"
    ontology_refs: [Asset]
    physical_tables: [tb_itzcbd]
    output_type: grouped_sum
    template: asset_value_by_dept


sql_templates:

  # --- IT资产总数（多维可选过滤） ---
  asset_total_count:
    plan: 统计IT资产总数。
    params:
      zczt: zczt
      pp: pp
      cfdd: cfdd
      cwsszt: cwsszt
      zcly: zcly
      gys: gys
      dept_id: dept_id
      user_id: user_id
    sql: >
      SELECT COUNT(*) AS total
      FROM tb_itzcbd a
      WHERE a.del_flag = 0
      [[zczt:AND a.zczt LIKE concat('%', %(zczt)s, '%')]]
      [[pp:AND a.pp LIKE concat('%', %(pp)s, '%')]]
      [[cfdd:AND a.cfdd LIKE concat('%', %(cfdd)s, '%')]]
      [[cwsszt:AND a.cwsszt LIKE concat('%', %(cwsszt)s, '%')]]
      [[zcly:AND a.zcly LIKE concat('%', %(zcly)s, '%')]]
      [[gys:AND a.gys LIKE concat('%', %(gys)s, '%')]]
      [[dept_id:AND a.dept_id LIKE concat('%', %(dept_id)s, '%')]]
      [[user_id:AND a.user_id LIKE concat('%', %(user_id)s, '%')]]


  # --- IT资产按分组条件分布 ---
  asset_groupby_count:
    plan: 按IT资产分组条件统计IT资产数量。
    sql: >
      SELECT 
      [[zczt:a.zczt AS IT资产状态]]
      [[pp:a.pp AS 品牌]]
      [[cfdd:a.cfdd AS 存放地点]]
      [[cwsszt:a.cwsszt AS 财务所属主体]]
      [[zcly:a.zcly AS 资产来源]]
      [[gys:a.gys AS 供应商]]
      [[zczl:a.zczl AS 资产中类]]
      [[zcxl:a.zcxl AS 资产小类]]
      , COUNT(*) AS total
      FROM tb_itzcbd a
      WHERE a.del_flag = 0
      [[zczt:GROUP BY a.zczt]]
      [[pp:GROUP BY a.pp]]
      [[cfdd:GROUP BY a.cfdd]]
      [[cwsszt:GROUP BY a.cwsszt]]
      [[zcly:GROUP BY a.zcly]]
      [[gys:GROUP BY a.gys]]
      [[zczl:GROUP BY a.zczl]]
      [[zcxl:GROUP BY a.zcxl]]
      ORDER BY total DESC


  # --- IT资产按部门分布 ---
  asset_by_dept:
    plan: 按所属部门编号分组统计IT资产数量。
    sql: >
      SELECT a.dept_id AS 所属部门, COUNT(*) AS total
      FROM tb_itzcbd a
      WHERE a.del_flag = 0
      GROUP BY a.dept_id
      ORDER BY total DESC


  # --- IT资产明细列表（多维可选过滤） ---
  asset_list:
    plan: 查询IT资产明细列表。
    params:
      zczt: zczt
      pp: pp
      cfdd: cfdd
      cwsszt: cwsszt
      user_id: user_id
    sql: >
      SELECT
        a.bqh AS 标签号,
        a.zcxl AS IT资产小类,
        a.pp AS 品牌,
        a.xh AS 型号,
        a.zczt AS IT资产状态,
        a.cfdd AS 存放地点,
        a.user_id AS 所属人,
        a.dept_id AS 所属部门,
        a.zcyz AS IT资产原值
      FROM tb_itzcbd a
      WHERE a.del_flag = 0
      [[user_id: and a.user_id = %(user_id)s]]
      [[zczt:AND a.zczt LIKE concat('%', %(zczt)s, '%')]]
      [[pp:AND a.pp LIKE concat('%', %(pp)s, '%')]]
      [[cfdd:AND a.cfdd LIKE concat('%', %(cfdd)s, '%')]]
      [[cwsszt:AND a.cwsszt LIKE concat('%', %(cwsszt)s, '%')]]
      ORDER BY a.id DESC


  # --- IT资产原值合计（可选过滤） ---
  asset_value_total:
    plan: 统计IT资产原值合计。
    params:
      zczt: zczt
      pp: pp
    sql: >
      SELECT SUM(CAST(COALESCE(a.zcyz, '0') AS DECIMAL(18,2))) AS total
      FROM tb_itzcbd a
      WHERE a.del_flag = 0
      [[zczt:AND a.zczt LIKE concat('%', %(zczt)s, '%')]]
      [[pp:AND a.pp LIKE concat('%', %(pp)s, '%')]]


  # --- IT资产原值按状态分布 ---
  asset_value_by_status:
    plan: 按IT资产状态分组统计IT资产原值合计。
    sql: >
      SELECT a.zczt AS IT资产状态, SUM(CAST(COALESCE(a.zcyz, '0') AS DECIMAL(18,2))) AS total
      FROM tb_itzcbd a
      WHERE a.del_flag = 0
      GROUP BY a.zczt
      ORDER BY total DESC

