version: 1                            # 配置文件版本号
notes:                                # 配置说明备注列表
  - 基于真实业务（docs/wiki）配置的意图与 SQL 模板，覆盖项目/采购/供应商/询价/用户/部门/会议/知讯等核心域。  # 真实业务语义配置
  - 这些表无 tenant_id，SQL 模板中通过 WHERE del_flag = 0 过滤逻辑删除数据。  # 逻辑删除说明
  - 仅 status=executable 且有 sql_templates 条目的意图才会生成 SQL；新增业务问题请在此添加意图与对应模板。  # 扩展指引

entities:                             # 实体定义（将业务实体映射到物理表）
  User:                               # 用户实体
    tables: [sys_user]                # 关联物理表
  Dept:                               # 部门实体
    tables: [sys_dept]                # 关联物理表 

intents:                              # 业务意图列表（多阶段匹配引擎的核心配置）

  # ==================== 用户/部门域 ====================
  - id: user_count                    # 意图唯一标识
    display_name: 用户总数            # 意图显示名称
    status: executable                # 意图状态
    priority: 88                      # 匹配优先级
    match: {all: ["用户"], any: ["总数", "有多少", "数量", "多少", "几人"]}  # 关键词匹配规则
    examples: ["用户总数是多少", "有多少个用户", "用户数量"]  # 示例问句
    semantic:                         # 语义扩展配置
      queries: ["统计用户总数", "用户一共有多少"]  # 语义查询变体
    ontology_refs: [User]             # 关联实体
    physical_tables: [sys_user]       # 实际物理表
    output_type: scalar_count         # 输出类型
    template: user_count              # SQL 模板名

  - id: user_by_dept                  # 意图唯一标识
    display_name: 用户按部门统计      # 意图显示名称
    status: executable                # 意图状态
    priority: 86                      # 匹配优先级
    match: {all: ["用户"], any: ["按部门", "部门统计", "部门分布", "各部门"]}  # 关键词匹配规则
    examples: ["用户按部门统计", "各部门用户数量", "各部门有多少用户"]  # 示例问句
    semantic:                         # 语义扩展配置
      queries: ["按部门统计用户", "用户部门分布"]  # 语义查询变体
    ontology_refs: [User, Dept]       # 关联实体（跨表 JOIN）
    physical_tables: [sys_user, sys_dept]  # 实际物理表（多表 JOIN）
    output_type: grouped_count        # 输出类型
    template: user_by_dept            # SQL 模板名

  - id: dept_count                    # 意图唯一标识
    display_name: 部门总数            # 意图显示名称
    status: executable                # 意图状态
    priority: 85                      # 匹配优先级
    match: {all: ["部门"], any: ["总数", "有多少", "数量", "多少", "几个"]}  # 关键词匹配规则
    examples: ["部门总数是多少", "有多少个部门", "部门数量"]  # 示例问句
    semantic:                         # 语义扩展配置
      queries: ["统计部门总数", "部门一共有多少"]  # 语义查询变体
    ontology_refs: [Dept]             # 关联实体
    physical_tables: [sys_dept]       # 实际物理表
    output_type: scalar_count         # 输出类型
    template: dept_count              # SQL 模板名

  - id: user_sex_ratio                # 意图唯一标识
    display_name: 用户男女比例        # 意图显示名称
    status: executable                # 意图状态
    priority: 87                      # 匹配优先级
    match: {any: ["男女比例", "性别比例", "男女分布", "性别分布", "男女", "性别"]}  # 关键词匹配规则（不强制"用户"，纯"男女比例"也可命中）
    examples: ["男女比例", "性别比例", "用户男女比例", "用户性别分布", "男女各有多少"]  # 示例问句
    semantic:                         # 语义扩展配置
      queries: ["按性别统计用户", "用户性别构成", "男女员工比例"]  # 语义查询变体
    ontology_refs: [User]             # 关联实体
    physical_tables: [sys_user]       # 实际物理表
    output_type: grouped_count        # 输出类型（分组计数，可生成饼图）
    template: user_sex_ratio          # SQL 模板名

  - id: user_by_center                  # 意图唯一标识
    display_name: 各中心人数            # 意图显示名称
    status: executable                  # 意图状态
    priority: 84                        # 匹配优先级
    match: {all: ["中心"], any: ["人数", "统计", "有多少", "数量", "多少", "几个"]}  # 关键词匹配规则
    examples: ["各中心的人数", "各中心有多少人", "每个中心的人数", "按中心统计人数"]  # 示例问句
    semantic:                           # 语义扩展配置
      queries: ["按中心统计用户", "各中心人员数量", "中心人数分布"]  # 语义查询变体
    ontology_refs: [User, Dept]         # 关联实体
    physical_tables: [sys_user, sys_dept]  # 实际物理表
    output_type: grouped_count          # 输出类型（分组计数，可生成柱状图/饼图）
    slot_defaults:                      # 默认 dept_lvl=1（二级部门=中心）
      dept_lvl: 2
    template: user_by_dept_level        # SQL 模板名（参数化模板，通过 dept_lvl 控制层级）

  - id: user_by_dept_level              # 意图唯一标识（泛化：LLM 自动提取层级）
    display_name: "按部门层级统计人数（dept_lvl：2=中心/二级, 3=三级, 4=四级, 5=五级，依次类推）"  # 意图显示名称，含层级映射供 LLM 理解
    status: executable                  # 意图状态
    priority: 83                        # 匹配优先级
    match: {any: ["级部门"]}            # 关键词匹配规则：命中"X级部门"即可触发（"中心"由 user_by_center 单独覆盖）
    examples:                           # 示例问句（供 LLM 学习层级映射模式）
      - "各三级部门的人数"
      - "各四级部门的人数"
      - "各五级部门的人数"
      - "按部门层级统计人数"
    semantic:                           # 语义扩展配置
      queries: ["按部门层级统计用户", "各级部门人员数量", "部门层级人员分布"]  # 语义查询变体
    ontology_refs: [User, Dept]         # 关联实体
    physical_tables: [sys_user, sys_dept]  # 实际物理表
    required_slots: [dept_lvl]          # 触发 LLM 槽位提取，从问句中推断层级编号
    slot_defaults:                      # LLM 提取失败时的默认值
      dept_lvl: 2
    output_type: grouped_count          # 输出类型
    template: user_by_dept_level        # 复用同一个参数化模板

  - id: user_by_parent_dept             # 意图唯一标识
    display_name: "指定部门下级各部门人数（parent_dept_name：上级部门名称）"  # 意图显示名称，含语义提示供 LLM 理解
    status: executable                  # 意图状态
    priority: 84                        # 匹配优先级
    match: {any: ["下级", "下属", "子部门", "各部门", "人数"]}  # 关键词匹配规则：命中"下级/下属/子部门"触发
    examples:                           # 示例问句（供 LLM 学习提取 parent_dept_name 模式）
      - "某部门下级各部门人数"
      - "技术中心下属部门人数"
      - "财务部下级部门人数"
      - "某部门子部门人数统计"
    semantic:                           # 语义扩展配置
      queries: ["某部门下级人数分布", "指定部门子部门人员统计"]  # 语义查询变体
    ontology_refs: [User, Dept]         # 关联实体
    physical_tables: [sys_user, sys_dept]  # 实际物理表
    required_slots: [parent_dept_name]  # 触发 LLM 提取上级部门名称（如"人力资源中心"）
    slot_defaults:                      # LLM 提取失败时的默认值
      parent_dept_name: 易鑫集团
    output_type: grouped_count          # 输出类型
    template: user_by_parent_dept       # SQL 模板名

  - id: user_count_by_dept             # 意图唯一标识
    display_name: 指定部门用户数      # 意图显示名称
    status: executable                 # 意图状态
    priority: 82                       # 匹配优先级
    match: {any: ["有多少人", "多少人", "几个", "人数", "几个"]}  # 关键词匹配规则
    examples: ["人力资源中心有多少人", "技术部有多少人", "行政部有多少人"]  # 示例问句
    semantic:                          # 语义扩展配置
      queries: ["某部门有多少用户", "部门员工人数", "指定部门用户统计"]  # 语义查询变体
    ontology_refs: [User, Dept]        # 关联实体（跨表 JOIN）
    physical_tables: [sys_user, sys_dept]  # 实际物理表
    required_slots: [dept_name]        # 必须提取的槽位
    slot_defaults:                     # 无 LLM 或 LLM 提取失败时的默认部门名
      dept_name: 易鑫集团
    output_type: scalar_count          # 输出类型
    template: user_count_by_dept       # SQL 模板名


sql_templates:        
  # ==================== 用户/部门域 ====================
  user_count:                         # 模板名：用户总数
    plan: 统计未删除的用户总数。      # 模板用途说明
    sql: >                            # SQL 语句
      SELECT COUNT(*) AS total
      FROM sys_user u
      WHERE u.del_flag = 0

  user_by_dept:                       # 模板名：用户按部门统计
    plan: 按部门分组统计用户数量（JOIN 部门表取部门名称）。  # 模板用途说明
    sql: >                            # SQL 语句（JOIN sys_dept，按部门名称分组）
      SELECT d.dept_name AS dept_name, COUNT(*) AS total
      FROM sys_user u
      JOIN sys_dept d ON u.dept_id = d.dept_id
      WHERE u.del_flag = 0 AND d.del_flag = 0
      GROUP BY d.dept_name
      ORDER BY total DESC

  dept_count:                         # 模板名：部门总数
    plan: 统计未删除的部门总数。      # 模板用途说明
    sql: >                            # SQL 语句
      SELECT COUNT(*) AS total
      FROM sys_dept d
      WHERE d.del_flag = 0

  user_sex_ratio:                     # 模板名：用户男女比例
    plan: "按性别分组统计用户数量（sex: 0男 1女 2未知，用 CASE WHEN 映射为中文标签）。"  # 模板用途说明
    sql: >                            # SQL 语句（按 sex 分组，CASE WHEN 转中文）
      SELECT
        CASE u.sex
          WHEN 0 THEN '男'
          WHEN 1 THEN '女'
          ELSE '未知'
        END AS sex_name,
        COUNT(*) AS total
      FROM sys_user u
      WHERE u.del_flag = 0
      GROUP BY u.sex
      ORDER BY total DESC

  user_by_dept_level:                   # 模板名：按部门层级统计人数（参数化 dept_lvl）
    plan: "按部门层级分组统计用户数量，dept_lvl 参数控制层级（1=中心/二级部门, 2=三级部门, 以此类推）。"  # 模板用途说明
    params:                              # SQL 参数映射
      dept_lvl: dept_lvl
    sql: >                               # SQL 语句（JOIN sys_dept，按 dept_lvl 参数过滤）
      SELECT d.dept_name AS dept_name, COUNT(*) AS total
      FROM sys_user u
      JOIN sys_dept d ON u.dept_id = d.dept_id
      WHERE u.del_flag = 0 AND d.del_flag = 0 AND d.dept_lvl = %(dept_lvl)s
      GROUP BY d.dept_name
      ORDER BY total DESC

  user_by_parent_dept:                  # 模板名：指定部门下级各部门人数
    plan: "查询指定部门（parent_dept_name）的直属下级各部门人数，通过 sys_dept 自关联 child.parent_id = parent.dept_id 解析父子关系。"  # 模板用途说明
    params:                              # SQL 参数映射
      parent_dept_name: parent_dept_name
    sql: >                               # SQL 语句（sys_dept 自关联：child JOIN parent）
      SELECT child.dept_name AS dept_name, COUNT(*) AS total
      FROM sys_user u
      JOIN sys_dept child ON u.dept_id = child.dept_id
      JOIN sys_dept parent ON child.parent_id = parent.dept_id
      WHERE u.del_flag = 0 AND child.del_flag = 0 AND parent.del_flag = 0
        AND parent.dept_long_name like concat('%', %(parent_dept_name)s, '%')
      GROUP BY child.dept_name
      ORDER BY total DESC

  user_count_by_dept:                  # 模板名：指定部门用户数
    plan: "按部门名称过滤统计用户数量（JOIN 部门表，dept_name 参数化）。"  # 模板用途说明
    params:                            # SQL 参数映射：%(key)s → slots 中的 slot 名
      dept_name: dept_name
    sql: >                             # SQL 语句（JOIN sys_dept，按部门名过滤）
      SELECT COUNT(*) AS total
      FROM sys_user u
      JOIN sys_dept d ON u.dept_id = d.dept_id
      WHERE u.del_flag = 0 AND d.del_flag = 0 AND d.dept_long_name like concat('%', %(dept_name)s, '%')
      