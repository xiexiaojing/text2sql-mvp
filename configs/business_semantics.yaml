version: 1                            # 配置文件版本号
notes:                                # 配置说明备注列表
  - 基于真实业务（docs/wiki）配置的意图与 SQL 模板，覆盖项目/采购/供应商/询价/用户/部门/会议/知讯等核心域。  # 真实业务语义配置
  - 这些表无 tenant_id，SQL 模板中通过 WHERE del_flag = 0 过滤逻辑删除数据。  # 逻辑删除说明
  - 仅 status=executable 且有 sql_templates 条目的意图才会生成 SQL；新增业务问题请在此添加意图与对应模板。  # 扩展指引

entities:                             # 实体定义（将业务实体映射到物理表）
  User:                               # 用户实体
    tables: [sys_user]                # 关联物理表
  Dept:                               # 部门实体
    tables: [sys_dept]                # 关联物理表 

intents:                              # 业务意图列表（多阶段匹配引擎的核心配置）

  # ==================== 用户/部门域 ====================
  - id: user_count                    # 意图唯一标识
    display_name: 用户总数            # 意图显示名称
    status: executable                # 意图状态
    priority: 88                      # 匹配优先级
    match: {all: ["用户"], any: ["总数", "有多少", "数量", "多少", "几人"]}  # 关键词匹配规则
    examples: ["用户总数是多少", "有多少个用户", "用户数量"]  # 示例问句
    semantic:                         # 语义扩展配置
      queries: ["统计用户总数", "用户一共有多少"]  # 语义查询变体
    ontology_refs: [User]             # 关联实体
    physical_tables: [sys_user]       # 实际物理表
    output_type: scalar_count         # 输出类型
    template: user_count              # SQL 模板名

  - id: user_by_dept                  # 意图唯一标识
    display_name: 用户按部门统计      # 意图显示名称
    status: executable                # 意图状态
    priority: 86                      # 匹配优先级
    match: {all: ["用户"], any: ["按部门", "部门统计", "部门分布", "各部门"]}  # 关键词匹配规则
    examples: ["用户按部门统计", "各部门用户数量", "各部门有多少用户"]  # 示例问句
    semantic:                         # 语义扩展配置
      queries: ["按部门统计用户", "用户部门分布"]  # 语义查询变体
    ontology_refs: [User, Dept]       # 关联实体（跨表 JOIN）
    physical_tables: [sys_user, sys_dept]  # 实际物理表（多表 JOIN）
    output_type: grouped_count        # 输出类型
    template: user_by_dept            # SQL 模板名

  - id: dept_count                    # 意图唯一标识
    display_name: 部门总数            # 意图显示名称
    status: executable                # 意图状态
    priority: 85                      # 匹配优先级
    match: {all: ["部门"], any: ["总数", "有多少", "数量", "多少", "几个"]}  # 关键词匹配规则
    examples: ["部门总数是多少", "有多少个部门", "部门数量"]  # 示例问句
    semantic:                         # 语义扩展配置
      queries: ["统计部门总数", "部门一共有多少"]  # 语义查询变体
    ontology_refs: [Dept]             # 关联实体
    physical_tables: [sys_dept]       # 实际物理表
    output_type: scalar_count         # 输出类型
    template: dept_count              # SQL 模板名


sql_templates:        
  # ==================== 用户/部门域 ====================
  user_count:                         # 模板名：用户总数
    plan: 统计未删除的用户总数。      # 模板用途说明
    sql: >                            # SQL 语句
      SELECT COUNT(*) AS total
      FROM sys_user u
      WHERE u.del_flag = 0

  user_by_dept:                       # 模板名：用户按部门统计
    plan: 按部门分组统计用户数量（JOIN 部门表取部门名称）。  # 模板用途说明
    sql: >                            # SQL 语句（JOIN sys_dept，按部门名称分组）
      SELECT d.dept_name AS dept_name, COUNT(*) AS total
      FROM sys_user u
      JOIN sys_dept d ON u.dept_id = d.dept_id
      WHERE u.del_flag = 0 AND d.del_flag = 0
      GROUP BY d.dept_name
      ORDER BY total DESC

  dept_count:                         # 模板名：部门总数
    plan: 统计未删除的部门总数。      # 模板用途说明
    sql: >                            # SQL 语句
      SELECT COUNT(*) AS total
      FROM sys_dept d
      WHERE d.del_flag = 0
      